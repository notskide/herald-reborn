name: Validate knowledge dictionary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata, index, and links
        run: python scripts/validate_knowledge.py
      - name: Run retrieval regression tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Smoke-test dictionary search
        run: |
          python scripts/search_knowledge.py --query "retrieval augmented generation" --limit 3
          python scripts/search_knowledge.py --query "privacy" --tag security --limit 3
